name: CI/CD Banc2Touche

# À chaque commit sur main : tests de l'API (PostgreSQL), build du front React,
# puis image Docker sur GHCR et mise à jour des services Render par Terraform.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-api:
    name: Tests API (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b2t_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest
      - run: python -m pytest -q app/tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/b2t_test

  build-front:
    name: Build front React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pas de liste nominative dans le dépôt public
        run: grep -q "const SEED=\[\];" src/banc/banc2touche.mjs

  build-deploy:
    name: Image Docker + Terraform Render
    needs: [test-api, build-front]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_api_key: ${{ secrets.RENDER_API_KEY }}
      TF_VAR_render_owner_id: ${{ secrets.RENDER_OWNER_ID }}
      TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
      TF_VAR_admin_username: ${{ secrets.B2T_ADMIN_USER }}
      TF_VAR_admin_password: ${{ secrets.B2T_ADMIN_PASSWORD }}
      TF_VAR_frontend_origin: ${{ vars.FRONTEND_ORIGIN || '*' }}
      FRONTEND_NAME: ${{ vars.FRONTEND_SERVICE || 'banc2touche' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          missing=""
          [ -n "$TF_VAR_render_api_key" ]  || missing="$missing RENDER_API_KEY"
          [ -n "$TF_VAR_render_owner_id" ] || missing="$missing RENDER_OWNER_ID"
          [ -n "$TF_VAR_database_url" ]    || missing="$missing DATABASE_URL"
          [ -n "$TF_VAR_admin_username" ]  || missing="$missing B2T_ADMIN_USER"
          [ -n "$TF_VAR_admin_password" ]  || missing="$missing B2T_ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets GitHub manquants :$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # mêmes règles que l'API : sinon le compte du responsable ne serait pas créé
          if ! printf '%s' "$TF_VAR_admin_username" | grep -Eqi '^[a-z0-9][a-z0-9._-]{2,39}$'; then
            echo "::error::B2T_ADMIN_USER : 3 à 40 caractères, lettres sans accent, chiffres, point ou tiret"
            exit 1
          fi
          if [ "${#TF_VAR_admin_password}" -lt 8 ]; then
            echo "::error::B2T_ADMIN_PASSWORD : 8 caractères au minimum"
            exit 1
          fi

      - name: Noms normalisés
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ACTOR=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_URL=ghcr.io/${OWNER}/b2t-api" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "API_NAME=b2t-api-${ACTOR}" >> "$GITHUB_ENV"
          echo "ADMINER_NAME=b2t-adminer-${ACTOR}" >> "$GITHUB_ENV"
          echo "TF_VAR_github_actor=${ACTOR}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_url=ghcr.io/${OWNER}/b2t-api" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        run: |
          docker build -t "${IMAGE_URL}:${IMAGE_TAG}" -t "${IMAGE_URL}:latest" .
          docker push "${IMAGE_URL}:${IMAGE_TAG}"
          docker push "${IMAGE_URL}:latest"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: terraform

      # Pas d'état Terraform conservé entre deux runs. Terraform crée les services qui n'existent pas encore.
      # Ceux qui existent déjà sont mis à jour par l'API Render : rattachés à Terraform, ils renvoient leur
      # réglage « maintenance », que Render refuse sur le plan gratuit.
      - name: Repérer les services Render existants
        run: |
          find_id() {
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services?name=$1&limit=20" \
              | jq -r --arg N "$1" '.[] | select(type=="object" and .service != null) | select(.service.name == $N) | .service.id' \
              | head -n 1
          }
          TARGETS=""
          for pair in "api:${API_NAME}" "adminer:${ADMINER_NAME}"; do
            RES="${pair%%:*}"; NAME="${pair#*:}"
            ID=$(find_id "$NAME")
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "${NAME} : pas encore créé, Terraform va le créer"
              TARGETS="${TARGETS:+${TARGETS} }-target=render_web_service.${RES}"
            else
              echo "${NAME} (${ID}) : existe déjà, mis à jour sur place"
            fi
            if [ "$RES" = "api" ]; then echo "API_ID=${ID}" >> "$GITHUB_ENV"; fi
          done
          echo "TF_TARGETS=${TARGETS}" >> "$GITHUB_ENV"
          FRONT_ID=$(find_id "${FRONTEND_NAME}")
          echo "FRONT_ID=${FRONT_ID}" >> "$GITHUB_ENV"

      - name: Terraform Apply (création)
        if: env.TF_TARGETS != ''
        working-directory: terraform
        run: terraform apply -input=false -auto-approve ${TF_TARGETS}

      - name: Mise à jour de l'API existante
        if: env.API_ID != '' && env.API_ID != 'null'
        run: |
          # mêmes variables que terraform/main.tf : la liste remplace celle du service
          # les secrets sont lus dans l'environnement par jq, ils n'apparaissent dans aucune commande
          jq -n '[{key:"ENV",value:"production"},{key:"APP_VERSION",value:env.IMAGE_TAG},
                  {key:"DATABASE_URL",value:env.TF_VAR_database_url},{key:"ADMIN_USERNAME",value:env.TF_VAR_admin_username},
                  {key:"ADMIN_PASSWORD",value:env.TF_VAR_admin_password},{key:"FRONTEND_ORIGIN",value:env.TF_VAR_frontend_origin}]' > env.json
          curl -fsS -o /dev/null -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            --data @env.json "https://api.render.com/v1/services/${API_ID}/env-vars"
          rm env.json
          echo "Variables d'environnement mises à jour"
          jq -n --arg img "${IMAGE_URL}:${IMAGE_TAG}" '{imageUrl:$img}' \
            | curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
                --data @- "https://api.render.com/v1/services/${API_ID}/deploys" | jq -r '"Déploiement lancé : \(.id) (\(.status))"'

      - name: Adresses des services
        run: |
          url() {
            curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services?name=$1&limit=20" \
              | jq -r --arg N "$1" '.[] | select(type=="object" and .service != null) | select(.service.name == $N) | .service.serviceDetails.url' \
              | head -n 1
          }
          API_URL=$(url "$API_NAME")
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          {
            echo "### Banc2Touche déployé"
            echo "| Service | Adresse |"
            echo "|---|---|"
            echo "| API Flask | ${API_URL} |"
            echo "| Adminer | $(url "$ADMINER_NAME") |"
            if [ -n "$FRONT_ID" ]; then echo "| Appli (Static Site) | $(url "$FRONTEND_NAME") |"; fi
            echo ""
            echo "À mettre dans la variable **B2T_API_URL** du Static Site Render : \`${API_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Le Static Site a été créé depuis l'adresse publique du dépôt : Render ne le reconstruit pas tout seul
      - name: Reconstruire l'appli (Static Site)
        if: env.FRONT_ID != '' && env.FRONT_ID != 'null'
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" \
            --data '{}' "https://api.render.com/v1/services/${FRONT_ID}/deploys" | jq -r '"Build de l'"'"'appli lancé : \(.id)"'

      - name: Vérification après déploiement
        run: |
          # le plan gratuit peut mettre plusieurs minutes à déployer puis à se réveiller
          for i in $(seq 1 40); do
            V=$(curl -s --max-time 60 "${API_URL}/info" | jq -r '.version // empty' || true)
            if [ "$V" = "${IMAGE_TAG}" ]; then
              echo "API en ligne en version ${V}"
              curl -s "${API_URL}/health"; echo
              exit 0
            fi
            echo "En attente du déploiement (${i}/40)… version en ligne : ${V:-aucune}"
            sleep 15
          done
          echo "::warning::La nouvelle version n'a pas encore répondu après 10 minutes : vérifie le tableau de bord Render."
